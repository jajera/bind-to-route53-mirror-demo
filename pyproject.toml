[project]
name = "bind-to-route53-mirror-demo"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "dnspython>=2.6",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "moto[route53]>=5.0",
    "boto3-stubs[route53]>=1.35",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
